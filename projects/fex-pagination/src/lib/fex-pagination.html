<div class="flex justify-between my-4">
  <div class="flex items-center">
    <!-- <p class="text-sm text-gray-700 dark:text-gray-300 hidden">Filas por página:</p> -->
    <select
      [(ngModel)]="activeSizeValue"
      (ngModelChange)="onSizeChange($event)"
      class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
    >
      @for (option of getSizeList(); track $index) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>
  <div class="justify-end">
    <nav aria-label="Page navigation example">
      <ul class="inline-flex -space-x-px text-sm gap-1">
        <li>
          <a
            class="flex items-center justify-center px-2 h-6 md:px-3 md:h-8 ms-0 leading-tight text-black bg-white border border-e border-gray-300 rounded-s hover:bg-blue-500 hover:text-gray-700 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-blue-500 dark:hover:text-white disabled:opacity-50 disabled:cursor-not-allowed"
            [routerLink]="[]"
            [queryParams]="buildQueryParams(activePage() - 1)"
            [class.pointer-events-none]="activePage() === 1"
            [class.opacity-50]="activePage() === 1"
            (click)="previousPage()"
            (mouseenter)="nextPagePrefet(activePage() - 2)"
          >
            <img
              src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgZmlsbD0iIzAwMDAwMCIgdmlld0JveD0iMCAwIDI1NiAyNTYiPjxwYXRoIGQ9Ik0xNjUuNjYsMjAyLjM0YTgsOCwwLDAsMS0xMS4zMiwxMS4zMmwtODAtODBhOCw4LDAsMCwxLDAtMTEuMzJsODAtODBhOCw4LDAsMCwxLDExLjMyLDExLjMyTDkxLjMxLDEyOFoiPjwvcGF0aD48L3N2Zz4="
              alt="Flecha izquierda"
              width="18"
              height="18"
            />
          </a>
        </li>
        @for (item of getPaginationButtons(); track item) {
          @if (item === '...') {
            <li>
              <span
                class="flex items-center justify-center px-2 h-6 md:px-3 md:h-8 leading-tight text-black border border-gray-300 bg-white dark:bg-gray-700 dark:text-gray-300"
              >
                ...
              </span>
            </li>
          } @else {
            <li>
              <a
                class="flex items-center justify-center px-2 h-6 md:px-3 md:h-8 leading-tight text-black border border-blue-500 hover:bg-blue-400 hover:text-white dark:hover:hover:bg-accent/50"
                [ngClass]="{
                  'bg-blue-600 text-white font-bold': item === activePage(),
                }"
                [routerLink]="[]"
                [queryParams]="buildQueryParams(+item)"
                (click)="nextPageSelected(item)"
                (mouseenter)="nextPagePrefet(+item - 1)"
              >
                {{ item }}</a
              >
            </li>
          }
        } @empty {
          <p>No hay paginas</p>
        }
        <li>
          <a
            (mouseenter)="nextPagePrefet(activePage())"
            class="flex items-center justify-center px-2 h-6 md:px-3 md:h-8 leading-tight text-black bg-white border border-gray-300 rounded-e hover:bg-blue-500 hover:text-gray-700 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-blue-500 dark:hover:text-white disabled:opacity-50 disabled:cursor-not-allowed"
            [routerLink]="[]"
            [queryParams]="buildQueryParams(activePage() + 1)"
            [class.pointer-events-none]="activePage() === pages()"
            [class.opacity-50]="activePage() === pages()"
            (click)="nextPage()"
          >
            <img
              src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgZmlsbD0iIzAwMDAwMCIgdmlld0JveD0iMCAwIDI1NiAyNTYiPjxwYXRoIGQ9Ik0xODEuNjYsMTMzLjY2bC04MCw4MGE4LDgsMCwwLDEtMTEuMzItMTEuMzJMMTY0LjY5LDEyOCw5MC4zNCw1My42NmE4LDgsMCwwLDEsMTEuMzItMTEuMzJsODAsODBBOCw4LDAsMCwxLDE4MS42NiwxMzMuNjZaIj48L3BhdGg+PC9zdmc+"
              alt="Flecha izquierda"
              width="18"
              height="18"
            />
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
